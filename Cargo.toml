[package]
name = "weapon-animation-hotreload"
version = "0.3.0-experimental.3"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
shikifsrs-elden-ring = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
pelite = "0.10"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lib]
name = "CapacityExpansion"
path = "src/capacity/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
sha2 = "0.10"

[workspace]
resolver = "2"
members = ["."]
